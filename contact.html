<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زينيث للطيران - تواصل معنا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر الرئيسي -->
    <header class="main-header">
        <div class="logo">
            <img src="logo.jpg" alt="شعار زينيث">
            <span class="brand-name">زينيث للطيران</span>
        </div>

        <nav class="nav-links">
            <a href="index.html" class="nav-btn">الرئيسية</a>
            <a href="flights.html" class="nav-btn">الرحلات</a>
            <a href="offers.html" class="nav-btn">العروض</a>
            <a href="contact.html" class="nav-btn active">تواصل معنا</a>
        </nav>
    </header>

    <!-- محتوى صفحة تواصل معنا -->
    <section class="page-content">
        <h1>تواصل مع خدمة العملاء</h1>
        <p class="subtitle">نحن هنا لمساعدتك والإجابة على استفساراتك على مدار الساعة.</p>

        <form class="contact-form">
            <div class="field-group">
                <label for="name">الاسم الكريم</label>
                <input type="text" id="name" placeholder="أدخل اسمك الكامل">
            </div>
            
            <div class="field-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="name@example.com">
            </div>

            <div class="field-group">
                <label for="message">الرسالة أو الاستفسار</label>
                <textarea id="message" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
            </div>

            <button type="submit" class="search-btn">إرسال الرسالة</button>
        </form>
    </section>

    <!-- الفوتر -->
     
    <footer class="main-footer">
        <p>جميع الحقوق محفوظه &copy; 2026 | Zenith Airlines</p>
    </footer>

</body>
</html>
